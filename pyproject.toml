[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "viber-export-native"
version = "0.1.0"
description = "Read selected Viber Desktop chats and download photo originals on Windows without UI automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["frida==17.24.3", "Pillow==12.2.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
include = ["viber_native*"]

[tool.setuptools.package-data]
viber_native = ["*.js"]
